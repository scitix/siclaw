# Optional operator provisioning in each authorized TARGET cluster.
# These are trusted node_exec facilities, separate from the unprivileged runner namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: siclaw-script-diagnostics
  labels:
    siclaw.io/component: script-diagnostics
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: script-diagnostics
  namespace: siclaw-script-diagnostics
  labels:
    siclaw.io/component: script-diagnostics
spec:
  hard:
    count/pods: "10"
    count/jobs.batch: "20"
